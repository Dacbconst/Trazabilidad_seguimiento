<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', sans-serif; background: #F6F5F1; }
    h1, h2, h3 { font-family: 'Sora', sans-serif; margin: 0; }
    select, input:focus { outline: 2px solid #1E6F5C; outline-offset: 1px; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #FFFFFF; display: flex; font-family: 'IBM Plex Sans', sans-serif;">

  <!-- Rail de iconos -->
  <div style="width: 72px; flex-shrink: 0; background: #163832; display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 22px; box-sizing: border-box;">
    <div style="width: 34px; height: 34px; border-radius: 9px; background: #1E6F5C; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; color: #EAF3F0;">ER</div>
    <div style="width: 1px; align-self: stretch; margin: 0 16px; background: rgba(255,255,255,0.12);"></div>
    <button aria-label="Buscar" style="width: 40px; height: 40px; border-radius: 10px; border: none; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; color: #EAF3F0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <button aria-label="Historial" style="width: 40px; height: 40px; border-radius: 10px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #8FB3AA;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    </button>
  </div>

  <!-- Columna de gestión / lista de actividades -->
  <div style="width: 300px; flex-shrink: 0; border-right: 1px solid #E3E1DA; display: flex; flex-direction: column; padding: 24px 20px; box-sizing: border-box; gap: 18px; background: #FBFAF8;">
    <div>
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #6B7280; text-transform: uppercase;">Tipo de gestión</div>
      <h2 style="font-size: 18px; font-weight: 600; color: #1F2420; margin-top: 4px;">Actividades</h2>
    </div>

    <div style="position: relative;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" style="position: absolute; left: 12px; top: 12px;"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" placeholder="Buscar actividad" style="width: 100%; height: 40px; border-radius: 10px; border: 1px solid #E3E1DA; padding: 0 14px 0 36px; font-size: 13px; color: #1F2420; background: #FFFFFF; box-sizing: border-box;">
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{actividades}}" as="act" hint-placeholder-count="3">
        <button onClick="{{act.pick}}" style="{{act.buttonStyle}}">
          <span style="width: 28px; height: 28px; border-radius: 8px; background: {{act.iconBg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{act.iconColor}}" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12h8M8 16h5"/></svg>
          </span>
          <span style="flex-grow: 1; text-align: left; font-size: 14px; font-weight: 500; color: #1F2420;">{{act.label}}</span>
          <span style="font-size: 11px; font-weight: 600; color: {{act.badgeColor}};">{{act.badge}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <!-- Formulario -->
  <div style="flex-grow: 1; padding: 40px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; overflow: hidden;">
    <div style="display: flex; align-items: flex-start; justify-content: space-between;">
      <div>
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: #6B7280; text-transform: uppercase;">Formulario</div>
        <h1 style="font-size: 24px; font-weight: 600; color: #1F2420; margin-top: 4px;">{{seleccionLabel}}</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #E4F2EE; color: #1E6F5C; font-size: 13px; font-weight: 600;">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #1E6F5C;"></span>
        Carlos Proaño
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 20px; max-width: 560px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 500; color: #3A3F3B;">Nombre del local / punto</label>
        <input type="text" placeholder="Ej. Distribuidora Central" style="height: 44px; border-radius: 10px; border: 1px solid #E3E1DA; padding: 0 14px; font-size: 14px; color: #1F2420; background: #FBFAF8; box-sizing: border-box;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 500; color: #3A3F3B;">Categoría de producto</label>
        <div style="height: 44px; border-radius: 10px; border: 1px solid #E3E1DA; padding: 0 14px; font-size: 14px; color: #1F2420; background: #FBFAF8; display: flex; align-items: center; justify-content: space-between;">
          <span>Impresoras multifunción</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 13px; font-weight: 500; color: #3A3F3B;">Resultado de la visita</label>
        <div style="height: 44px; border-radius: 10px; border: 1px solid #E3E1DA; padding: 0 14px; font-size: 14px; color: #1F2420; background: #FBFAF8; display: flex; align-items: center; justify-content: space-between;">
          <span>Selecciona una opción</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 8px;">
        <button type="button" style="height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid #E3E1DA; background: #FFFFFF; color: #3A3F3B; font-size: 14px; font-weight: 600;">Guardar borrador</button>
        <button type="button" style="height: 44px; padding: 0 20px; border-radius: 10px; border: none; background: #1E6F5C; color: #FFFFFF; font-size: 14px; font-weight: 600;">Enviar registro</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
const DATA = [
  { id: 1, label: 'Actividad 1 — Visibilidad', badge: 'Nuevo' },
  { id: 2, label: 'Actividad 2 — Mantenimiento', badge: '' },
  { id: 3, label: 'Actividad 3 — Auditoría', badge: '' },
];

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 1 };
  }

  renderVals() {
    const picked = this.state.picked ?? 1;
    const actividades = DATA.map((a) => {
      const selected = a.id === picked;
      return {
        ...a,
        pick: () => this.setState({ picked: a.id }),
        iconBg: selected ? '#1E6F5C' : '#E3E1DA',
        iconColor: selected ? '#FFFFFF' : '#6B7280',
        badgeColor: selected ? '#1E6F5C' : '#B8B5AA',
        buttonStyle: 'display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid ' + (selected ? '#1E6F5C' : 'transparent') + ';background:' + (selected ? '#E4F2EE' : 'transparent') + ';',
      };
    });
    const actual = DATA.find((a) => a.id === picked);
    return {
      actividades,
      seleccionLabel: actual ? actual.label : 'Selecciona una actividad',
    };
  }
}
</script>
</body>
</html>
